<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alemanha AR - Multi Alvo</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .a-enter-vr,
    .a-enter-ar {
      display: none !important;
    }

  </style>

</head>

<body>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
    filterMinCF: 0.0001;
    filterBeta: 0.001;
    missTolerance: 5;
    warmupTolerance: 5;
  "

  color-space="sRGB"

  renderer="colorManagement: true, physicallyCorrectLights"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <!-- =========================================
       CÂMERA
       ========================================= -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>


  <!-- =========================================
       TARGET 0 - BANDEIRA
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 0">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="0 - BANDEIRA"
      align="center"
      width="2"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 1 - MASCOTE
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 1">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="1 - MASCOTE"
      align="center"
      width="2"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 2 - BERLIM
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 2">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="2 - BERLIM"
      align="center"
      width="2"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 3 - COLÔNIA
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 3">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="3 - COLONIA"
      align="center"
      width="2"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 4 - SAXÔNIA-ANHALT
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 4">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="4 - SAXONIA-ANHALT"
      align="center"
      width="1.7"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 5 - BADEN-WÜRTTEMBERG
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 5">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="5 - BADEN-WURTTEMBERG"
      align="center"
      width="1.55"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 6 - MUNIQUE
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 6">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="6 - MUNIQUE"
      align="center"
      width="2"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>


  <!-- =========================================
       TARGET 7 - HAMBURGO
       ========================================= -->

  <a-entity mindar-image-target="targetIndex: 7">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="7 - HAMBURGO"
      align="center"
      width="2"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>


</a-scene>

</body>

</html>
