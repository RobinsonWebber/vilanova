<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Alemanha AR</title>

  <!-- A-FRAME -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- MINDAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


  <!-- =====================================================
       BANDEIRA ONDULANTE
       ESTA É A VERSÃO QUE JÁ FUNCIONOU
       ===================================================== -->

  <script>

    AFRAME.registerComponent('flag-wave', {

      init: function () {

        const THREE = AFRAME.THREE;

        const geometry =
          new THREE.PlaneGeometry(
            1.10,
            0.66,
            32,
            30
          );

        const position =
          geometry.attributes.position;

        this.originalZ =
          new Float32Array(position.count);

        const colors =
          new Float32Array(position.count * 3);

        const preto =
          new THREE.Color('#000000');

        const vermelho =
          new THREE.Color('#DD0000');

        const amarelo =
          new THREE.Color('#FFCC00');


        for (let i = 0; i < position.count; i++) {

          this.originalZ[i] =
            position.getZ(i);

          const y =
            position.getY(i);

          let cor;

          if (y > 0.11) {

            cor = preto;

          } else if (y > -0.11) {

            cor = vermelho;

          } else {

            cor = amarelo;

          }

          colors[i * 3] =
            cor.r;

          colors[i * 3 + 1] =
            cor.g;

          colors[i * 3 + 2] =
            cor.b;
        }


        geometry.setAttribute(
          'color',
          new THREE.BufferAttribute(colors, 3)
        );


        const material =
          new THREE.MeshBasicMaterial({

            vertexColors: true,
            side: THREE.DoubleSide

          });


        const mesh =
          new THREE.Mesh(
            geometry,
            material
          );


        this.el.setObject3D(
          'flag',
          mesh
        );


        this.geometry =
          geometry;

      },


      tick: function (time) {

        if (!this.geometry) return;

        const position =
          this.geometry.attributes.position;

        const segundos =
          time / 1000;


        for (let i = 0; i < position.count; i++) {

          const x =
            position.getX(i);

          const distanciaMastro =
            (x + 0.55) / 1.10;


         const onda =
          Math.sin(
            x * 8 -
            segundos * 3.5
          )
          * 0.045
          * distanciaMastro;

        const detalhe =
          Math.sin(
            x * 14 -
            segundos * 5
          )
          * 0.012
          * distanciaMastro;


          position.setZ(
            i,
            this.originalZ[i] +
            onda +
            detalhe
          );

        }


        position.needsUpdate =
          true;

      }

    });

  AFRAME.registerComponent('audio-alemao', {

  init: function () {

    const alvo = this.el;
    const audio = document.querySelector('#audio-alemao');

    let tocando = false;

    alvo.addEventListener('targetFound', function () {

      if (tocando) return;

      audio.currentTime = 0;

      audio.play()
        .then(() => {
          tocando = true;
        })
        .catch((erro) => {
          console.log('Áudio bloqueado pelo navegador:', erro);
        });

    });

    alvo.addEventListener('targetLost', function () {

      audio.pause();
      audio.currentTime = 0;
      tocando = false;

    });

    audio.addEventListener('ended', function () {
      tocando = false;
    });

  }

  }); 

  </script>


  <style>

    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      overflow: hidden;

    }


    .a-enter-vr,
    .a-enter-ar {

      display: none !important;

    }

  </style>

</head>


<body>


<a-scene

  mindar-image="
    imageTargetSrc: ./targets.mind;
    maxTrack: 1;
    filterMinCF: 0.0001;
    filterBeta: 0.001;
    missTolerance: 5;
    warmupTolerance: 5;
  "

  color-space="sRGB"

  renderer="colorManagement: true, physicallyCorrectLights"

  vr-mode-ui="enabled: false"

  device-orientation-permission-ui="enabled: false">


  <!-- =====================================================
       ASSETS
       ===================================================== -->

  <a-assets>

    <img
      id="img-alemao"
      src="./alemao.png">

      <img
      id="img-berlim"
      src="./berlim.png">

      <audio
        id="audio-alemao"
        src="./alemao.mp3"
        preload="auto">
      </audio>
      
  </a-assets>



  <!-- =====================================================
       CÂMERA
       ===================================================== -->

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>



  <!-- =====================================================
       TARGET 0
       BANDEIRA
       NÃO MEXER 😂
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 0">


    <!-- MASTRO -->

    <a-cylinder
      position="-0.59 0 0.05"
      radius="0.018"
      height="0.90"
      color="#888888">
    </a-cylinder>


    <!-- PONTA DO MASTRO -->

    <a-sphere
      position="-0.59 0.47 0.05"
      radius="0.035"
      color="#FFCC00">
    </a-sphere>


    <!-- BANDEIRA -->

    <a-entity
      flag-wave
      position="0 0.10 0.12"
      rotation="-12 0 0">
    </a-entity>


    <!-- TEXTO -->

    <a-text
      value="DEUTSCHLAND"
      align="center"
      width="1.6"
      color="#000000"
      position="0 -0.48 0.12">
    </a-text>


  </a-entity>



  <!-- =====================================================
       TARGET 1
       MASCOTE / ALEMÃO
       ===================================================== -->

  <a-entity
  mindar-image-target="targetIndex: 1" audio-alemao>


    <!--
         ALEMÃO

         IMPORTANTE:
         NÃO EXISTE MAIS SCALE 0.05.
         O PERSONAGEM FICA SEMPRE EM TAMANHO NORMAL.
    -->

    <a-image
      id="personagem-alemao"

      src="#img-alemao"

      width="0.82"
      height="1.15"

      position="0 0.05 0.15"

      scale="1 1 1"

      material="
        shader: flat;
        transparent: true;
        side: double;
      ">


      <!--
           ENTRADA:
           apenas sobe.
           NÃO altera escala.
      -->

      <a-animation
        attribute="position"
        from="0 -0.45 0.15"
        to="0 0.05 0.15"
        dur="800"
        easing="ease-out">
      </a-animation>


    </a-image>



    <!-- =================================================
         PROST!
         ================================================= -->

    <a-text
      value="PROST!"

      align="center"

      width="2"

      color="#FFD700"

      position="0 0.72 0.18">
    </a-text>



    <!-- =================================================
         FRASE
         ================================================= -->

    <a-text
      value="WILLKOMMEN IN DEUTSCHLAND!"

      align="center"

      width="1.40"

      color="#FFFFFF"

      position="0 -0.62 0.18">
    </a-text>


  </a-entity>



  <!-- =====================================================
     TARGET 2 - BERLIM
     PORTÃO DE BRANDENBURGO
     ===================================================== -->

<a-entity mindar-image-target="targetIndex: 2">

  <!-- PORTÃO -->

  <a-image
    src="#img-berlim"

    width="1.35"
    height="0.90"

    position="0 0.10 0.15"

    material="
      shader: flat;
      transparent: true;
      side: double;
    "

    animation__entrada="
      property: position;
      from: 0 -0.45 0.15;
      to: 0 0.10 0.15;
      dur: 900;
      easing: easeOutBack;
    "

    animation__flutuar="
      property: position;
      from: 0 0.10 0.15;
      to: 0 0.15 0.15;
      dur: 1800;
      delay: 1000;
      dir: alternate;
      loop: true;
      easing: easeInOutSine;
    ">
  </a-image>


  <!-- TÍTULO -->

  <a-text
    value="BERLIM"

    align="center"

    width="2.2"

    color="#FFD700"

    position="0 0.72 0.20"

    animation="
      property: scale;
      from: 0.5 0.5 0.5;
      to: 1 1 1;
      dur: 600;
      delay: 700;
      easing: easeOutBack;
    ">
  </a-text>


  <!-- SUBTÍTULO -->

  <a-text
    value="PORTAO DE BRANDENBURGO"

    align="center"

    width="1.55"

    color="#FFFFFF"

    position="0 -0.48 0.20">
  </a-text>


  <!-- INFORMAÇÃO -->

  <a-text
    value="UM DOS PRINCIPAIS SIMBOLOS DA CAPITAL ALEMA."

    align="center"

    width="1.25"

    color="#FFFFFF"

    position="0 -0.59 0.20">
  </a-text>

</a-entity>


  <!-- =====================================================
       TARGET 3
       COLÔNIA
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 3">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="3 - COLONIA"
      align="center"
      width="2"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>



  <!-- =====================================================
       TARGET 4
       SAXÔNIA-ANHALT
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 4">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="4 - SAXONIA-ANHALT"
      align="center"
      width="1.7"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>



  <!-- =====================================================
       TARGET 5
       BADEN-WÜRTTEMBERG
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 5">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="5 - BADEN-WURTTEMBERG"
      align="center"
      width="1.55"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>



  <!-- =====================================================
       TARGET 6
       MUNIQUE
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 6">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="6 - MUNIQUE"
      align="center"
      width="2"
      color="#FFD700"
      position="0 0 0.01">
    </a-text>

  </a-entity>



  <!-- =====================================================
       TARGET 7
       HAMBURGO
       ===================================================== -->

  <a-entity mindar-image-target="targetIndex: 7">

    <a-plane
      width="1"
      height="0.40"
      color="#111111"
      opacity="0.90">
    </a-plane>

    <a-text
      value="7 - HAMBURGO"
      align="center"
      width="2"
      color="#FFFFFF"
      position="0 0 0.01">
    </a-text>

  </a-entity>


</a-scene>


</body>

</html>
