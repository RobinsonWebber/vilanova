<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avaliação Qualitativa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <h1>Avaliação Qualitativa</h1>
        <p>Registro de conceitos A, B e C por aluno, ano e trimestre.</p>
      </div>
    </header>

      <section class="card conceitos-info">
    <div class="card-header">
      <h2>Legenda dos Conceitos</h2>
    </div>

    <div class="conceitos-grid">
      <div class="conceito-info">
        <strong>A</strong>
        <span>Realizou plenamente</span>
        <small>Vale 10 pontos</small>
      </div>

      <div class="conceito-info">
        <strong>B</strong>
        <span>Realizou parcialmente</span>
        <small>Vale 5 pontos</small>
      </div>

      <div class="conceito-info">
        <strong>C</strong>
        <span>Não realizou / necessita retomada</span>
        <small>Vale 0 ponto</small>
      </div>
    </div>
  </section>

    <section class="card filtros">
      <div class="card-header">
        <h2>Pesquisa</h2>
        <span id="contadorRegistros" class="badge">0 alunos</span>
      </div>

      <div class="grid grid-filtros">
        <label>
          Pesquisar aluno
          <input id="pesquisaAluno" type="search" placeholder="Digite parte do nome..." />
        </label>

        <label>
          Filtrar turma
          <select id="filtroTurma">
            <option value="">Todas as turmas</option>
            <option value="31">31</option>
            <option value="32">32</option>
            <option value="33">33</option>
            <option value="34">34</option>
            <option value="41">41</option>
            <option value="42">42</option>
            <option value="43">43</option>
          </select>
        </label>

        <label>
          Ano letivo
          <select id="anoSelect"></select>
        </label>

        <label>
          Trimestre
          <select id="trimestreSelect"></select>
        </label>
      </div>

    </section>

    <section class="card grid">
      <label>
        Turma
        <select id="turmaSelect"></select>
      </label>

      <label>
        Aluno
        <select id="alunoSelect"></select>
      </label>
    </section>

    <div class="actions">
        <button id="btnAnterior" class="secondary">◀ Anterior</button>
        <button id="btnProximo" class="secondary">Próximo ▶</button>
        <button id="btnLimparPesquisa" class="secondary">Limpar pesquisa</button>
        <button id="btnRecarregarAlunos" class="secondary">Recarregar alunos</button>
        <button id="btnRelatorio" class="secondary">Relatório</button>
    </div>


    <section class="card">
      <div class="card-header">
        <h2>Conceitos</h2>
        <span id="statusAluno" class="badge">Carregando alunos...</span>
      </div>

      <div id="itensContainer" class="itens"></div>

      <div class="resultado">
        <strong>Nota final:</strong>
        <span id="notaFinal">-</span>
      </div>

      <div class="actions">
        <button id="btnSalvar">Salvar avaliação</button>
        <button id="btnLimpar" class="secondary">Limpar conceitos</button>
      </div>

      <p id="mensagem" class="mensagem"></p>
    </section>
  </main>

  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
