<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Relatório de Avaliações</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f6fb;
      color: #162033;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, #0f3566, #1f6feb);
      color: white;
      padding: 24px;
      border-radius: 20px;
      margin-bottom: 20px;
    }

    .hero h1 {
      margin: 0 0 8px;
    }

    .hero p {
      margin: 0;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 8px 20px rgba(22, 32, 51, 0.08);
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .info {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge {
      background: #e9f1ff;
      color: #0f3566;
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      background: #0f3566;
      color: white;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: #e9edf5;
      color: #162033;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    thead {
      background: #0f3566;
      color: white;
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #edf0f6;
      text-align: left;
      font-size: 0.95rem;
    }

    tbody tr:nth-child(even) {
      background: #f8fbff;
    }

    .nota {
      font-weight: 800;
      color: #0f3566;
    }

    .conceitos {
      font-size: 0.9rem;
      color: #475569;
    }

    .loading {
      text-align: center;
      padding: 40px;
      font-weight: 700;
    }

    @media print {

      body {
        background: white;
        padding: 0;
      }

      .actions {
        display: none;
      }

      .card {
        box-shadow: none;
      }

      .hero {
        background: #0f3566 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="hero">
      <h1>Relatório de Avaliações Qualitativas</h1>
      <p>Resumo de conceitos e médias da turma.</p>
    </header>

    <section class="card">

      <div class="topo">

        <div class="info">
          <div class="badge" id="badgeTurma">Turma: -</div>
          <div class="badge" id="badgeAno">Ano: -</div>
          <div class="badge" id="badgeTrimestre">Trimestre: -</div>
        </div>

        <div class="actions">
          <button onclick="window.print()">
            Imprimir / Salvar PDF
          </button>

          <button class="secondary" onclick="window.close()">
            Fechar
          </button>
        </div>

      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Turma</th>
              <th>Aluno</th>
              <th>Nota Final</th>
              <th>Conceitos</th>
            </tr>
          </thead>

          <tbody id="tbodyRelatorio">
            <tr>
              <td colspan="4" class="loading">
                Carregando avaliações...
              </td>
            </tr>
          </tbody>

        </table>

      </div>

    </section>

  </div>

  <script>

    /*
      CONFIGURE AQUI
    */

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3bvjwOEazNAOC42TViM7uJrAscHmeV6FjbHYDJdBZ69nak-N9xFKXS5k-8qXidRKQ/exec";

    const tbody = document.getElementById("tbodyRelatorio");

    const params = new URLSearchParams(window.location.search);

    const turma = params.get("turma") || "";
    const ano = params.get("ano") || "";
    const trimestre = params.get("trimestre") || "";

    document.getElementById("badgeTurma").textContent =
      `Turma: ${turma || "Todas"}`;

    document.getElementById("badgeAno").textContent =
      `Ano: ${ano || "-"}`;

    document.getElementById("badgeTrimestre").textContent =
      `Trimestre: ${trimestre || "-"}`;

    async function carregarRelatorio() {

      try {

        const url =
          `${APPS_SCRIPT_URL}?acao=listarAvaliacoes`
          + `&turma=${encodeURIComponent(turma)}`
          + `&ano=${encodeURIComponent(ano)}`
          + `&trimestre=${encodeURIComponent(trimestre)}`;

        const resposta = await fetch(url);

        const retorno = await resposta.json();

        if (retorno.status !== "ok") {
          throw new Error(retorno.mensagem || "Erro ao carregar.");
        }

        montarTabela(retorno.avaliacoes);

      } catch (erro) {

        console.error(erro);

        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="loading">
              Erro ao carregar relatório.
            </td>
          </tr>
        `;
      }
    }

    function montarTabela(avaliacoes) {

      if (!avaliacoes.length) {

        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="loading">
              Nenhuma avaliação encontrada.
            </td>
          </tr>
        `;

        return;
      }

      tbody.innerHTML = "";

      avaliacoes.forEach(avaliacao => {

        let conceitosTexto = "";

        try {

          const json = JSON.parse(avaliacao.dados_json);

          conceitosTexto = Object.entries(json)
            .map(([item, conceito]) =>
              `<strong>${conceito}</strong> - ${item}`
            )
            .join("<br>");

        } catch {

          conceitosTexto = "Erro ao ler conceitos";
        }

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${avaliacao.turma}</td>

          <td>
            <strong>${avaliacao.nome}</strong>
          </td>

          <td class="nota">
            ${Number(avaliacao.nota_final || 0)
              .toFixed(2)
              .replace(".", ",")}
          </td>

          <td class="conceitos">
            ${conceitosTexto}
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    carregarRelatorio();

  </script>

</body>
</html>
