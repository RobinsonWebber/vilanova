<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detetives dos animais</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf4ff;color:#17344c;font:700 16px 'Trebuchet MS',sans-serif}header{background:#17344c;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}main{max-width:1250px;margin:auto;padding:24px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:#fff;color:#17344c}button:focus-visible{outline:4px solid #ffb900}nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.active,.primary{background:#176bd5;color:white}.intro{display:flex;justify-content:space-between;gap:16px;align-items:center}.intro p{font-weight:400;line-height:1.5}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.animal{background:white;border:2px solid #d5e2f2;border-radius:20px;padding:16px;box-shadow:0 5px 0 #d5e2f2;text-align:center}.portrait{font-size:65px;line-height:1.3}.animal h2{font-size:19px;margin:8px}.slot{width:100%;min-height:51px;margin:6px 0;border:2px dashed #b0c2d6;background:#f5f8ff;font-size:14px}.filled{border-style:solid;background:#e4efff}.good{border-color:#158352;background:#e4f8ed}.bad{border-color:#d44343;background:#fff0ef}.bank{background:#dce9fa;border-radius:20px;padding:18px;margin-top:24px}.bank h2{font-size:18px;margin-top:0}.blocks{display:flex;flex-wrap:wrap;gap:10px}.block{background:#ffda64;border:2px solid #c49516;box-shadow:0 3px 0 #c49516;font-size:15px}.block[data-cat="1"]{background:#b5e3dc;border-color:#479c90;box-shadow:0 3px 0 #479c90}.block[data-cat="2"]{background:#e2cafa;border-color:#996fc3;box-shadow:0 3px 0 #996fc3}.selected{outline:4px solid #176bd5;transform:translateY(-3px)}footer{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:22px 0}#message{line-height:1.5;flex:1}small{font-weight:400}.done{background:#ddf6e9;padding:18px;border-radius:15px}@media(max-width:850px){.board{grid-template-columns:repeat(2,1fr)}header small{display:none}}@media(max-width:430px){main{padding:12px}.board{gap:10px}.animal{padding:9px}h1{font-size:20px}.intro{display:block}.portrait{font-size:53px}}
</style><header><h1>🔎 DETETIVES DOS ANIMAIS</h1><small>INFORMÁTICA • PROF. ROBINSON • 2º ANO</small></header><main><div class="intro"><div><h2>QUAL BLOCO COMBINA?</h2><p>ARRASTE OS BLOCOS ATÉ OS ANIMAIS.<br>OU CLIQUE EM UM BLOCO E DEPOIS NO ESPAÇO CERTO.</p></div><span id="progress"></span></div><nav id="levels" aria-label="Desafios"></nav><div id="board" class="board"></div><section class="bank"><h2>BLOCOS DE CARACTERÍSTICAS</h2><div class="blocks" id="bank"></div><p><small>PARA DEVOLVER UM BLOCO, CLIQUE NELE NO ANIMAL.</small></p></section><footer><button class="primary" id="check">CONFERIR</button><button id="reset">RECOMEÇAR</button><button id="next" hidden>PRÓXIMO DESAFIO</button><div id="message" role="status" aria-live="polite"></div></footer></main><script>
const animals=[
['🐶','CACHORRO','4 PATAS','PELOS','LATE'],['🐱','GATO','4 PATAS','PELOS','MIA'],['🐦','PÁSSARO','2 PATAS','PENAS','TEM BICO'],['🐟','PEIXE','0 PATAS','ESCAMAS','TEM NADADEIRAS'],
['🐰','COELHO','4 PATAS','PELOS','ORELHAS COMPRIDAS'],['🐢','TARTARUGA','4 PATAS','CASCO','TEM CASCO'],['🦋','BORBOLETA','6 PATAS','ASAS COM ESCAMAS','TEM ANTENAS'],['🐸','SAPO','4 PATAS','PELE SEM PELOS','SALTA'],
['🐴','CAVALO','4 PATAS','PELOS','TEM CRINA'],['🦆','PATO','2 PATAS','PENAS','TEM BICO'],['🐍','COBRA','0 PATAS','ESCAMAS','RASTEJA'],['🐝','ABELHA','6 PATAS','PELOS FINOS','PRODUZ MEL']];
const labels=['PATAS','COBERTURA DO CORPO','UMA CARACTERÍSTICA'];let level=0,selected=null,blocks=[],placed={},finished=new Set();const $=id=>document.getElementById(id);function shuffle(a){return a.sort(()=>Math.random()-.5)}function start(n){level=n;placed={};selected=null;blocks=shuffle(animals.slice(n*4,n*4+4).flatMap((a,i)=>a.slice(2).map((text,cat)=>({id:i+'-'+cat,text,cat}))));$('message').textContent='';$('next').hidden=true;render()}
function render(){ $('levels').innerHTML='';for(let n=0;n<3;n++){let b=document.createElement('button');b.textContent=(finished.has(n)?'✓ ':'')+'DESAFIO '+(n+1);b.className=n===level?'active':'';b.onclick=()=>start(n);$('levels').append(b)}$('progress').textContent=Object.keys(placed).length+' / 12 BLOCOS';$('board').innerHTML='';animals.slice(level*4,level*4+4).forEach((a,i)=>{let card=document.createElement('article');card.className='animal';card.innerHTML='<div class="portrait" role="img" aria-label="'+a[1]+'">'+a[0]+'</div><h2>'+a[1]+'</h2>';labels.forEach((label,cat)=>{let key=i+'-'+cat,b=document.createElement('button');b.className='slot'+(placed[key]?' filled':'');b.textContent=placed[key]?blocks.find(x=>x.id===placed[key]).text:label;b.setAttribute('aria-label',a[1]+': '+b.textContent);b.onclick=()=>{if(selected)put(key);else if(placed[key]){delete placed[key];clearFeedback();render()}};b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();selected=e.dataTransfer.getData('text/plain');put(key)};card.append(b)});$('board').append(card)});$('bank').innerHTML='';blocks.filter(b=>!Object.values(placed).includes(b.id)).forEach(b=>{let el=document.createElement('button');el.className='block'+(selected===b.id?' selected':'');el.textContent=b.text;el.dataset.cat=b.cat;el.draggable=true;el.onclick=()=>{selected=selected===b.id?null:b.id;render()};el.ondragstart=e=>{selected=b.id;e.dataTransfer.setData('text/plain',b.id)};$('bank').append(el)})}
function clearFeedback(){$('message').textContent='';$('next').hidden=true}function put(key){const b=blocks.find(x=>x.id===selected);if(!b)return;if(b.cat!==Number(key.split('-')[1])){$('message').textContent='ESSE BLOCO É DE OUTRO TIPO. PROCURE O ESPAÇO DE '+labels[b.cat]+'.';return}Object.keys(placed).forEach(k=>{if(placed[k]===selected)delete placed[k]});placed[key]=selected;selected=null;clearFeedback();render()}
$('check').onclick=()=>{let correct=0;document.querySelectorAll('.animal').forEach((card,i)=>card.querySelectorAll('.slot').forEach((slot,c)=>{const b=blocks.find(x=>x.id===placed[i+'-'+c]);const good=b&&b.text===animals[level*4+i][c+2];slot.classList.toggle('good',!!good);slot.classList.toggle('bad',!!b&&!good);if(good)correct++}));if(correct===12){finished.add(level);$('message').textContent=finished.size===3?'🎉 VOCÊ COMPLETOU OS 3 DESAFIOS! PARABÉNS, DETETIVE!':'🎉 MUITO BEM! TODOS OS ANIMAIS ESTÃO CERTOS!';$('next').hidden=level===2}else $('message').textContent=correct+' DE 12 CORRETOS. '+(Object.keys(placed).length<12?'COMPLETE OS ESPAÇOS VAZIOS. ':'')+'REVEJA OS BLOCOS VERMELHOS E TENTE NOVAMENTE.'};$('reset').onclick=()=>start(level);$('next').onclick=()=>start(level+1);start(0);
</script></html>
