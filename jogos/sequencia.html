<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detetives das Sequências</title><style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&display=swap');
*{box-sizing:border-box}body{margin:0;background:#fff9ec;color:#253c43;font-family:Nunito,Arial,sans-serif}header{padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #eadfc8;background:#fffdf7}button{font:800 15px Nunito,Arial;cursor:pointer;border:2px solid #253c43;border-radius:14px;padding:13px 20px;background:white;color:#253c43;box-shadow:0 3px #253c43}button:active{transform:translateY(3px);box-shadow:none}button:focus-visible{outline:4px solid #ef9d2d;outline-offset:4px}.brand{font-family:Fredoka,Arial;font-size:23px}.tag{font-size:12px;letter-spacing:2px;color:#627b77}main{max-width:1180px;margin:auto;padding:24px}nav{display:flex;justify-content:center;gap:12px;margin-bottom:24px}.dot{border-radius:50%;width:42px;height:42px;padding:0;background:#ede7d9}.dot.active{background:#f6bb4f}.dot.done{background:#96d1ba}.intro{text-align:center}h1{font:600 clamp(30px,4vw,45px) Fredoka,Arial;margin:8px 0}p{margin:8px 0 20px;color:#526b6d}.eyebrow{color:#427f6b;font-size:13px;letter-spacing:2px;font-weight:900}.board{background:#e4eee7;border:2px solid #bacfc1;border-radius:24px;padding:22px;margin-top:24px}.label{font-size:12px;letter-spacing:2px;font-weight:900;margin-bottom:15px}.slots,.cards{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px}.slot{position:relative;min-height:205px;border:2px dashed #88a99a;border-radius:18px;background:#f6faf5;display:flex;align-items:center;justify-content:center;padding:8px}.num{position:absolute;top:-14px;left:12px;width:29px;height:29px;border-radius:50%;background:#253c43;color:white;text-align:center;line-height:29px;font-weight:900}.placeholder{color:#749087;font-size:13px;text-align:center}.cards{margin-top:22px;min-height:210px}.card{width:100%;min-height:190px;border:2px solid #253c43;border-radius:17px;background:#fff;box-shadow:0 5px 0 #dfd6c4;padding:12px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:grab;text-align:center;font-size:13px;font-weight:900;touch-action:manipulation}.card.selected{outline:5px solid #f4b642;transform:translateY(-5px)}.art{font-size:60px;line-height:1.2;min-height:85px;display:flex;align-items:center;justify-content:center;background:#fff4d7;border-radius:14px;width:100%;letter-spacing:-5px}.slot .card{min-height:175px;box-shadow:none}.actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:24px}.primary{background:#f4b642}.feedback{text-align:center;font-size:18px;font-weight:900;min-height:32px;margin-top:18px}footer{text-align:center;font-size:12px;padding:25px;color:#71837b}.win{text-align:center;padding:35px;background:#e4eee7;border-radius:25px}.win .medal{font-size:100px} @media(max-width:760px){.slots,.cards{grid-template-columns:repeat(2,1fr)}.slot{min-height:180px}.card{min-height:165px}.art{font-size:48px}header .tag{display:none}main{padding:18px} .board{padding:18px 12px}}
</style><header><div class="brand">🔎 DETETIVES DAS SEQUÊNCIAS</div><div class="tag">INFORMÁTICA · PROF. ROBINSON</div></header><main><nav id="nav" aria-label="Desafios"></nav><section id="game"></section></main><footer>1º ANO · CADA PASSO TEM SUA VEZ! · SEM PRESSA, VOCÊ PODE TENTAR NOVAMENTE.</footer><script>
const challenges=[{title:'VAMOS CALÇAR O TÊNIS',icon:'👟',steps:[['🦶🧦','COLOCAR A MEIA'],['🧦👟','CALÇAR O TÊNIS'],['👟✅','FECHAR O VELCRO']],hint:'A MEIA VEM ANTES DO TÊNIS.'},{title:'VAMOS ORGANIZAR A MOCHILA',icon:'🎒',steps:[['🎒🔓','ABRIR A MOCHILA'],['📓➡️🎒','GUARDAR O CADERNO'],['🎒🔒','FECHAR A MOCHILA'],['🧒🎒','COLOCAR NAS COSTAS']],hint:'PRIMEIRO PRECISAMOS ABRIR A MOCHILA.'},{title:'VAMOS FAZER UM SANDUÍCHE',icon:'🥪',steps:[['🍞🍽️','COLOCAR O PÃO NO PRATO'],['🧀⬇️🍞','COLOCAR O QUEIJO'],['🍞⬇️🧀','COBRIR COM OUTRO PÃO'],['😋🥪','COMER O SANDUÍCHE']],hint:'MONTE O SANDUÍCHE ANTES DE COMER.'},{title:'VAMOS LAVAR AS MÃOS',icon:'🧼',steps:[['🚰👐','MOLHAR AS MÃOS'],['🧴👐','PASSAR SABONETE'],['🫧🤲','ESFREGAR AS MÃOS'],['🚰🫧','ENXAGUAR AS MÃOS'],['🧻👐','SECAR AS MÃOS']],hint:'MOLHE AS MÃOS ANTES DO SABONETE. SEQUE SOMENTE NO FINAL.'},{title:'VAMOS PLANTAR UMA SEMENTE',icon:'🌱',steps:[['🪴🟤','COLOCAR TERRA NO VASO'],['👆🕳️','FAZER UM BURAQUINHO'],['🫘⬇️🕳️','COLOCAR A SEMENTE'],['🟤🫘','COBRIR COM TERRA'],['💧🪴','REGAR']],hint:'PREPARE A TERRA ANTES DE COLOCAR A SEMENTE.'}];
let level=0,slots=[],bank=[],selected=null,done=new Set(),solved=false;
const el=id=>document.getElementById(id);function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(i){if('speechSynthesis'in window)speechSynthesis.cancel();level=i;slots=Array(challenges[i].steps.length).fill(null);bank=shuffle(slots.map((_,j)=>j));if(bank.every((x,j)=>x===j))bank.push(bank.shift());selected=null;solved=false;render()}
function card(id){const s=challenges[level].steps[id];return `<button class="card ${selected===id?'selected':''}" draggable="${!solved}" data-id="${id}" aria-pressed="${selected===id}" aria-label="${s[1]}"><span class="art" aria-hidden="true">${s[0]}</span><span>${s[1]}</span></button>`}
function render(){el('nav').innerHTML=challenges.map((c,i)=>`<button class="dot ${i===level?'active':''} ${done.has(i)?'done':''}" onclick="start(${i})" aria-label="Desafio ${i+1}: ${c.title}" ${i===level?'aria-current="step"':''}>${done.has(i)?'✓':i+1}</button>`).join('');const c=challenges[level];el('game').innerHTML=`<div class="intro"><div class="eyebrow">MISSÃO ${level+1} DE 5 · ${c.steps.length} PASSOS</div><h1>${c.icon} ${c.title}</h1><p>O QUE VEM PRIMEIRO? ARRASTE AS CENAS PARA A ORDEM CERTA.<br>VOCÊ TAMBÉM PODE CLICAR NA CENA E DEPOIS NO ESPAÇO.</p><button onclick="speak()">🔊 OUVIR INSTRUÇÕES</button></div><div class="board"><div class="label">① MONTE A SEQUÊNCIA</div><div class="slots" style="--n:${c.steps.length}">${slots.map((id,i)=>`<div class="slot" data-slot="${i}" tabindex="0" role="button" aria-label="Passo ${i+1}${id!==null?': '+c.steps[id][1]:', vazio'}"><span class="num">${i+1}</span>${id===null?'<span class="placeholder">COLOQUE<br>UMA CENA AQUI</span>':card(id)}</div>`).join('')}</div></div><div class="label" style="margin-top:25px">② ESCOLHA AS CENAS</div><div id="bank" class="cards" style="--n:${c.steps.length}">${bank.map(card).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button onclick="start(level)">↻ RECOMEÇAR</button><button class="primary" id="check" onclick="check()">CONFERIR ✓</button><button id="next" hidden onclick="next()">PRÓXIMO DESAFIO →</button></div>`;bind()}
function move(id,to){if(solved)return;let from=slots.indexOf(id);let displaced=slots[to];if(from!==-1)slots[from]=displaced;else{bank=bank.filter(x=>x!==id);if(displaced!==null)bank.push(displaced)}slots[to]=id;selected=null;render()}
function bind(){document.querySelectorAll('.card').forEach(b=>{b.onclick=e=>{e.stopPropagation();if(solved)return;let id=+b.dataset.id;let parent=b.closest('.slot');if(selected!==null&&selected!==id&&parent){move(selected,+parent.dataset.slot);return}selected=selected===id?null:id;render()};b.ondragstart=e=>{selected=+b.dataset.id;e.dataTransfer.setData('text/plain',b.dataset.id);e.dataTransfer.effectAllowed='move'}});document.querySelectorAll('.slot').forEach(s=>{s.onclick=()=>{if(selected!==null)move(selected,+s.dataset.slot)};s.onkeydown=e=>{if(e.target===s&&(e.key==='Enter'||e.key===' ')){e.preventDefault();s.click()}};s.ondragover=e=>e.preventDefault();s.ondrop=e=>{e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(raw!==''&&Number.isInteger(+raw)&&+raw>=0&&+raw<slots.length)move(+raw,+s.dataset.slot)}});el('bank').ondragover=e=>e.preventDefault();el('bank').ondrop=e=>{e.preventDefault();if(solved)return;let raw=e.dataTransfer.getData('text/plain');if(raw==='')return;let id=+raw,idx=slots.indexOf(id);if(idx>=0){slots[idx]=null;bank.push(id);selected=null;render()}}}
function check(){if(slots.includes(null)){el('feedback').textContent='FALTA UMA CENA! PREENCHA TODOS OS ESPAÇOS. 🔎';return}if(slots.every((v,i)=>v===i)){solved=true;done.add(level);selected=null;render();el('feedback').textContent='MUITO BEM! CADA PASSO ESTÁ NO SEU LUGAR! ⭐';el('check').hidden=true;el('next').hidden=false;document.querySelectorAll('.card').forEach(b=>b.draggable=false)}else{el('feedback').textContent='VAMOS PENSAR MAIS UM POUCO? '+challenges[level].hint}}
function next(){if(done.size===5){el('game').innerHTML='<div class="win"><div class="medal">🏅</div><div class="eyebrow">CINCO MISSÕES CONCLUÍDAS</div><h1>VOCÊ É UM DETETIVE<br>DAS SEQUÊNCIAS!</h1><p>VOCÊ DESCOBRIU COMO A ORDEM DOS PASSOS FAZ A DIFERENÇA.</p><button class="primary" onclick="done.clear();start(0)">JOGAR NOVAMENTE ↻</button></div>'}else{let i=(level+1)%5;while(done.has(i))i=(i+1)%5;start(i)}}
function speak(){if(!('speechSynthesis'in window)){el('feedback').textContent='LEIA AS INSTRUÇÕES COM O PROFESSOR.';return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(challenges[level].title+'. Arraste as cenas para os espaços, na ordem das ações. Você também pode clicar em uma cena e depois no espaço. Quando terminar, clique em conferir.');u.lang='pt-BR';u.rate=.85;speechSynthesis.speak(u)}start(0);
</script></html>
